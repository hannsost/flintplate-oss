# Active local runtime separation since 2026-09-12 (migration 082).
# Keep this administrative-tool alias identical to compose.yaml.
name: flintplate
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: flintplate
      POSTGRES_PASSWORD: ${FLINTPLATE_DB_PASSWORD:?Run scripts/setup-local.py}
      POSTGRES_DB: flintplate
    volumes:
      - flintplate_db:/var/lib/postgresql/data
      - ./deploy/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U flintplate -d flintplate"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${FLINTPLATE_REDIS_PASSWORD:?Run scripts/setup-local.py}
    healthcheck:
      test: [CMD, redis-cli, --no-auth-warning, -a, "${FLINTPLATE_REDIS_PASSWORD}", ping]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    image: ${FLINTPLATE_RUNTIME_IMAGE:-flintplate-backend:runtime}
    build: ./backend
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,nosuid,size=536870912,mode=1777"]
    environment:
      # Explicit application keys only. The owner password is never passed to
      # this service, and no host env or administrative directory is mounted.
      DATABASE_URL: postgresql+asyncpg://flintplate_runtime:${FLINTPLATE_RUNTIME_DB_PASSWORD:?Run scripts/setup-local.py}@db:5432/flintplate
      REDIS_URL: redis://:${FLINTPLATE_REDIS_PASSWORD:?Run scripts/setup-local.py}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Run scripts/setup-local.py}
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-["http://localhost:3012","http://127.0.0.1:3012"]}'
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3012}
      FIREFLINT_BASE_URL: ${FIREFLINT_BASE_URL:-}
      FLINTPLATE_CONNECTOR_KEY: ${FLINTPLATE_CONNECTOR_KEY:-}
      FLINTPLATE_REPLACEMENT_WORKER: ${FLINTPLATE_REPLACEMENT_WORKER:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SENTRY_DSN: ${SENTRY_DSN:-}
      INVOICE_VALIDATOR_URL: ${INVOICE_VALIDATOR_URL:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-2000}
      SCRAPER_IMPORT_KEY: ${SCRAPER_IMPORT_KEY:-scraper-import-key-change-me}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@palmscout.invalid}
      SMTP_TLS: ${SMTP_TLS:-true}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      AI_MOCK_MODE: ${AI_MOCK_MODE:-true}
      AGENTS_EXTERNAL_AI_ENABLED: ${AGENTS_EXTERNAL_AI_ENABLED:-false}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-1500}
      AI_REQUESTS_PER_MIN: ${AI_REQUESTS_PER_MIN:-20}
      BA_CLIENT_ID: ${BA_CLIENT_ID:-}
      BA_CLIENT_SECRET: ${BA_CLIENT_SECRET:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_PROFESSIONAL: ${STRIPE_PRICE_PROFESSIONAL:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # Keep existing relative file references valid after the role switch.
      UPLOAD_DIR: uploads
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HOME: /tmp/huggingface
    ports: ["127.0.0.1:8012:8000"]
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/uploads:/app/uploads
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped
  migrate:
    profiles: [tools]
    image: ${FLINTPLATE_RUNTIME_IMAGE:-flintplate-backend:runtime}
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://flintplate:${FLINTPLATE_DB_PASSWORD:?Run scripts/setup-local.py}@db:5432/flintplate
      FLINTPLATE_RUNTIME_DB_PASSWORD: ${FLINTPLATE_RUNTIME_DB_PASSWORD:?Run scripts/setup-local.py}
      REDIS_URL: redis://:${FLINTPLATE_REDIS_PASSWORD:?Run scripts/setup-local.py}@redis:6379/1
      SECRET_KEY: administrative-job-does-not-issue-user-tokens
      APP_ENV: test
      AI_MOCK_MODE: "true"
      FLINTPLATE_REPLACEMENT_WORKER: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./backend:/app:ro
      - ./backend/uploads:/data/uploads
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: [python, -m, tools.migrate]
    restart: "no"
  backup_uploads:
    # Run only via flintplate_ops.py. Its sole data mount is passed explicitly
    # read-only, also allowing a purely synthetic permission/restore drill.
    profiles: [tools]
    image: ${FLINTPLATE_RUNTIME_IMAGE:-flintplate-backend:runtime}
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /tool
    volumes:
      - ./scripts/flintplate_ops.py:/tool/flintplate_ops.py:ro
    entrypoint: [python]
    command: [-c, "from flintplate_ops import archive_stdout; raise SystemExit(archive_stdout())"]
    restart: "no"
volumes:
  flintplate_db:
